[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "open-finance-toolkit"
dynamic = ["version"]
description = "Clean, categorise and summarise bank transaction CSVs, with support for Indian bank statement formats."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Itz-https" }]
keywords = ["finance", "bank statement", "csv", "pdf", "transactions", "pandas", "india", "personal finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]
dashboard = ["streamlit", "plotly"]
dev = ["pytest>=7", "pytest-cov", "ruff", "build", "twine", "pdfplumber>=0.10"]

[project.scripts]
open-finance-toolkit = "open_finance_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/Itz-https/open-finance-toolkit"
Documentation = "https://github.com/Itz-https/open-finance-toolkit/tree/main/docs"
Issues = "https://github.com/Itz-https/open-finance-toolkit/issues"
Changelog = "https://github.com/Itz-https/open-finance-toolkit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/open_finance_toolkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/open_finance_toolkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["examples/dashboard"]

[tool.ruff.lint.per-file-ignores]
"tests/data/*.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP037", "UP045"]
